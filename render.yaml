services:
  - type: web
    name: niveshrakshak-api
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: niveshrakshak-db
          property: connectionString
      - key: STORE_FULL_TEXT
        value: "false"
databases:
  - name: niveshrakshak-db
    databaseName: niveshrakshak
    user: niveshrakshak
